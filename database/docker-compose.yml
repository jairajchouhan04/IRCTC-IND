version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: railbook-postgres
    restart: always
    environment:
      POSTGRES_USER: railbook_user
      POSTGRES_PASSWORD: railbook_password
      POSTGRES_DB: railbook_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U railbook_user -d railbook_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: railbook-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
